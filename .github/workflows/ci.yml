name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: expense
          POSTGRES_PASSWORD: expense
          POSTGRES_DB: expense_io
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U expense -d expense_io"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Base recréée par tests/helpers/global-setup.ts à chaque exécution, avec
      # le rôle propriétaire ; l'application y est testée avec le rôle
      # applicatif `expense_app`, soumis à la RLS, et le worker avec
      # `expense_worker` (tests/helpers/test-database.ts).
      TEST_DATABASE_URL: postgres://expense:expense@localhost:5433/expense_io_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Tous les tests, avec la couverture : échoue si une couche passe sous
      # son seuil (vitest.config.ts, docs/adr/0010-couverture-de-tests.md).
      - run: npm run test:coverage

      - name: Résumé de la couverture
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;console.log('## Couverture\n\n| Mesure | % |\n|---|---|\n'+['lines','statements','functions','branches'].map(k=>'| '+k+' | '+t[k].pct+' |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rapport HTML de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
