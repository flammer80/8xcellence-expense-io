services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expense_io
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U expense -d expense_io']
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    # MinIO a fermé l'accès anonyme à ses images officielles — LocalStack
    # (édition communautaire, S3 uniquement) est le remplaçant retenu.
    # Épinglé sur la branche 3.x : `:latest`/`:stable` exigent désormais un
    # `LOCALSTACK_AUTH_TOKEN` (licence).
    image: localstack/localstack:3.8.1
    restart: unless-stopped
    environment:
      SERVICES: s3
    ports:
      - '4567:4566'
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 5s
      retries: 10

  observability:
    # Stack d'observabilité locale en un conteneur (ADR 0011) : collecteur
    # OpenTelemetry (OTLP), Tempo (traces), Loki (logs), Prometheus
    # (métriques) et Grafana. Épinglée : pas de `:latest`.
    image: grafana/otel-lgtm:0.37.0
    restart: unless-stopped
    ports:
      - '3001:3000' # Grafana (le port 3000 est celui de Next.js)
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP (utilisé par l'application)
    volumes:
      # Tableaux de bord et alertes versionnés, provisionnés au démarrage.
      - ./observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/expense-io.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/expense-io-dashboards:ro
      - ./observability/grafana/alerting/expense-io.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/expense-io.yaml:ro
      - observability-data:/data
    healthcheck:
      # Le conteneur crée ce fichier quand tous ses composants sont prêts.
      test: ['CMD-SHELL', 'test -f /tmp/ready']
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  localstack-data:
  observability-data:
