openapi: 3.1.0
info:
  title: Expense.io API
  version: 2.1.0
  description: |
    Contrat de l'API d'Expense.io, source de vérité (contract first, CLAUDE.md §10).
    Il est mis à jour **avant** chaque changement de route. Les types TypeScript
    des corps échangés vivent dans `src/interface/http/dto.ts` (mêmes noms que
    les schémas ci-dessous), partagés par le back et le front.

    Toutes les routes y figurent, y compris les anciennes, dépréciées. Choix
    de style : `docs/adr/0004-route-de-decision.md`, `0007-asynchrone-unifie.md`
    et `0008-contrat-et-front.md`.

    **2.0.0 (MAJOR)** : `receiptKey` disparaît de `ExpenseNote` (détail de
    stockage). Voir `CHANGELOG.md`.

    Erreurs : RFC 9457 (`application/problem+json`) partout. Codes : 400 corps
    ou paramètre illisible, 401 sans session, 403 rôle insuffisant, 404
    ressource introuvable ou invisible, 409 conflit d'état, 422 règle métier,
    500 avec `correlationId`. Les routes qui renvoyaient `{ error }` gardent
    ce membre (extension, dépréciée) et leurs codes historiques ; les routes
    dépréciées gardent leur format `{ error }`.

    **2.1.0 (MINOR)** : sondes `GET /api/health/live` et `GET /api/health/ready`
    (ADR 0011) ; `X-Correlation-Id` renvoyé par toutes les routes.

    Traçabilité : toutes les routes acceptent un en-tête `X-Correlation-Id`
    (8 à 64 caractères `[A-Za-z0-9._-]`, sinon il est généré) et le renvoient.
    Il suit la requête jusqu'aux logs du worker, et chaque log porte aussi le
    `trace_id` OpenTelemetry de la requête (ADR 0011).

    Authentification : session NextAuth (cookie `authjs.session-token`).
servers:
  - url: http://localhost:3000

tags:
  - name: notes
    description: Notes de frais (ressources REST)
  - name: users
    description: Annuaire de l'entreprise et rattachements (RH)
  - name: async
    description: Traitements en arrière-plan (ADR 0007)
  - name: legacy
    description: Anciennes routes, conservées comme adaptateurs fins et dépréciées
  - name: ops
    description: Sondes d'exploitation (ADR 0011), sans authentification

paths:
  /api/health/live:
    get:
      tags: [ops]
      operationId: liveness
      summary: Sonde de vie
      description: |
        Le process répond : 200, sans toucher à aucune dépendance. Un
        orchestrateur redémarre l'instance si cette sonde échoue.
      security: []
      responses:
        '200':
          description: Le process est vivant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Liveness' }

  /api/health/ready:
    get:
      tags: [ops]
      operationId: readiness
      summary: Sonde de disponibilité
      description: |
        L'instance peut servir du trafic : Postgres et le stockage S3 répondent.
        503 dès qu'une dépendance est indisponible (le répartiteur cesse alors
        d'envoyer du trafic, sans redémarrer l'instance). Chaque vérification
        est bornée à 2 secondes. Aucune information sensible (ni hôte, ni
        message d'erreur) n'est renvoyée.
      security: []
      responses:
        '200':
          description: Toutes les dépendances répondent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: Au moins une dépendance est indisponible.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    required: [checks]
                    properties:
                      checks: { $ref: '#/components/schemas/HealthChecks' }

  /api/expense-notes:
    get:
      tags: [notes]
      operationId: listMyExpenseNotes
      summary: Mes notes de frais
      parameters:
        - name: sort
          in: query
          required: false
          description: |
            `<colonne> [ASC|DESC]`, colonne parmi `created_at`, `expense_date`,
            `amount`, `status` (casse indifférente). Par défaut, les plus
            récentes d'abord. Toute autre valeur répond 400 (SEC-01).
          schema: { type: string, example: amount DESC }
      responses:
        '200':
          description: Notes de l'utilisateur connecté.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExpenseNote' }
        '400':
          description: '`sort` invalide (pointeur `#/sort`, `error: Invalid sort`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [notes]
      operationId: submitExpenseNote
      summary: Soumettre une note de frais avec son reçu
      description: |
        Ouvert à tous les rôles (règle n°1). La note est créée `pending`, dans
        l'entreprise de son auteur.

        Aucune note sans reçu (ADR 0006) : le reçu est déposé d'abord, sous une
        clé dérivée de l'UUID de la note, puis la note est insérée en une seule
        écriture. Si l'envoi échoue, rien n'est créé ; si l'insertion échoue, le
        reçu déposé est supprimé.

        Le type du reçu est vérifié sur son contenu (premiers octets), pas
        seulement sur le type MIME annoncé.

        Erreurs RFC 9457 ; le membre historique `error` est conservé, avec les
        mêmes messages et les mêmes codes qu'avant la version 2.0.0.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [amount, expenseDate, description, receipt]
              properties:
                amount:
                  type: string
                  description: Montant décimal strictement positif, deux décimales au plus.
                  example: '42.50'
                expenseDate:
                  type: string
                  format: date
                  description: Jour réel du calendrier, `YYYY-MM-DD`.
                description:
                  type: string
                  minLength: 1
                receipt:
                  type: string
                  format: binary
                  description: PNG, JPEG, WebP ou PDF, 10 Mo au plus.
      responses:
        '201':
          description: Note créée.
          headers:
            Location:
              description: URL de la note créée.
              schema: { type: string, example: /api/expense-notes/7d0c3f0e-9b8a-4c55-9d7e-2b1f6a3c4e5d }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseNote' }
        '400':
          description: |
            Champ manquant ou invalide (`error: Champs invalides`), type de reçu
            refusé ou contenu qui ne correspond pas au type annoncé (`Type de
            fichier non autorisé pour le reçu`), reçu trop volumineux (`Fichier
            trop volumineux`). `errors[].pointer` désigne le champ.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/expense-notes/{id}/decision:
    post:
      tags: [notes]
      operationId: decideExpenseNote
      summary: Trancher une note (approuver ou rejeter)
      description: |
        Action métier modélisée en sous-ressource (`POST …/decision`). Seul le
        validateur désigné par l'`ApprovalPolicy` peut trancher :
        - le manager direct de l'auteur ;
        - à défaut (auteur sans manager : manager racine, employé non rattaché, RH),
          un RH de la même entreprise ;
        - jamais l'auteur lui-même.

        Une note ne se tranche qu'une fois : rejouer l'appel renvoie 409 sans
        modifier la décision enregistrée (idempotence de l'état final).
      parameters:
        - $ref: '#/components/parameters/NoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
            examples:
              approve:
                value: { decision: approved }
              reject:
                value: { decision: rejected, reason: Justificatif illisible }
      responses:
        '200':
          description: Décision enregistrée ; la note dans son état final.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseNote'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            L'utilisateur voit la note mais n'est pas son validateur désigné : sa propre
            note, ou un RH face à la note d'un employé qui a un manager direct.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La note est déjà tranchée (y compris par une décision concurrente).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Règle métier violée (motif fourni pour une approbation, motif trop long).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/expense-notes/{id}/receipt-url:
    get:
      tags: [notes]
      operationId: getReceiptUrl
      summary: URL temporaire du reçu d'une note
      description: |
        Accessible à l'auteur de la note et à son validateur désigné, quel que
        soit le statut. Une note qu'on n'a pas le droit de voir répond 404,
        comme une note inexistante.

        Erreurs RFC 9457, avec le membre historique `error`.
      parameters:
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          description: URL pré-signée, valable 5 minutes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptUrl' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/expense-notes/pending:
    get:
      tags: [notes]
      operationId: listPendingApprovals
      summary: Ma file de validation
      description: |
        Les notes en attente que l'utilisateur connecté peut trancher, selon
        l'`ApprovalPolicy` : celles de ses subordonnés directs pour un manager ;
        celles des utilisateurs sans manager et des autres RH pour un RH ; liste
        vide pour un employé. Les plus anciennes d'abord, avec le nom de l'auteur.
        Remplace `GET /api/manager/expense-notes` et `GET /api/hr/expense-notes`.
      responses:
        '200':
          description: Notes à trancher, éventuellement aucune.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PendingApproval' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/users:
    get:
      tags: [users]
      operationId: listCompanyUsers
      summary: Annuaire de l'entreprise (RH)
      description: Employés et managers de l'entreprise du RH connecté, triés par nom. Les RH n'y figurent pas.
      responses:
        '200':
          description: Annuaire.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CompanyUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/users/{id}/manager:
    put:
      tags: [users]
      operationId: assignManager
      summary: Rattacher un utilisateur à son manager (RH)
      description: |
        Règle n°6 : le RH rattache un employé ou un manager à un manager de **sa**
        entreprise, sans créer de cycle (A → B → A, ou plus long). `null`
        détache l'utilisateur, qui devient racine (ses notes reviennent au RH).
        PUT : la requête remplace le rattachement ; la rejouer donne le même état.
        Deux rattachements concurrents ne peuvent pas former un cycle.
      parameters:
        - name: id
          in: path
          required: true
          description: Utilisateur à rattacher.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignManagerRequest' }
            examples:
              assign: { value: { managerId: 2f9a1c3e-5b7d-4e8f-9a0b-1c2d3e4f5a6b } }
              detach: { value: { managerId: null } }
      responses:
        '200':
          description: L'utilisateur, rattaché.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyUser' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Utilisateur inexistant, RH, ou d'une autre entreprise.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `managerId` (pointeur `#/managerId`) ne désigne pas un manager de
            l'entreprise, désigne l'utilisateur lui-même, ou créerait un cycle.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/receipt-suggestions:
    post:
      tags: [async]
      operationId: requestReceiptSuggestion
      summary: Demander l'analyse OCR d'un reçu (asynchrone)
      description: |
        L'analyse se fait en arrière-plan, par le worker de l'outbox (ADR 0007) :
        la requête répond **202** tout de suite, avec un lien de suivi dans
        `Location`. Le client interroge ce lien (polling) jusqu'à `done` ou `failed`.

        Erreur d'acceptation (cette réponse) ≠ erreur de traitement (statut
        `failed` de la ressource, après plusieurs tentatives).

        Image de 5 Mo au plus (SEC-08), type vérifié sur son contenu.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [receipt]
              properties:
                receipt:
                  type: string
                  format: binary
                  description: PNG, JPEG ou WebP (un PDF est accepté mais rien n'en est extrait), 5 Mo au plus.
      responses:
        '202':
          description: Demande acceptée, analyse en cours.
          headers:
            Location:
              description: Lien de suivi de la demande.
              schema: { type: string, example: /api/receipt-suggestions/0b6f1c1e-3c55-4d1a-9f0e-6f2a5b7c8d9e }
            Retry-After:
              description: Délai conseillé avant le premier polling, en secondes.
              schema: { type: integer, example: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptSuggestion' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: Type refusé, contenu qui ne correspond pas au type annoncé (`#/receipt.type`) ou fichier trop gros (`#/receipt.size`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/receipt-suggestions/{id}:
    get:
      tags: [async]
      operationId: getReceiptSuggestion
      summary: Suivre une demande d'analyse OCR (polling)
      description: |
        Renvoie l'état de la demande. Tant qu'elle est `pending`, la réponse porte
        `Retry-After`. Seul son auteur la voit.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: État de la demande.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptSuggestion' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: Demande inexistante ou d'un autre utilisateur.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/notifications:
    get:
      tags: [async]
      operationId: listMyNotifications
      summary: Mes notifications (décisions sur mes notes)
      description: |
        Les 20 plus récentes, de la plus récente à la plus ancienne. Écrites par
        le worker de l'outbox en réaction à `ExpenseNoteDecided` ; un événement
        rejoué ne crée jamais de doublon.
      responses:
        '200':
          description: Liste, éventuellement vide.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/expense-notes/receipt-suggestion:
    post:
      tags: [legacy]
      deprecated: true
      summary: (Déprécié) Analyse OCR synchrone d'un reçu
      description: |
        Remplacé par `POST /api/receipt-suggestions` (202 + polling). Conservé
        pour ses consommateurs existants, mais borné (SEC-08) : 5 Mo au plus,
        worker Tesseract partagé, une analyse à la fois. Une panne de l'OCR
        renvoie une suggestion vide.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [receipt]
              properties:
                receipt: { type: string, format: binary }
      responses:
        '200':
          description: Champs reconnus, éventuellement aucun. Porte `Deprecation` et `Link`.
          headers:
            Deprecation: { schema: { type: string, example: 'true' } }
            Link: { schema: { type: string, example: '</api/receipt-suggestions>; rel="successor-version"' } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  amount: { type: number }
                  expenseDate: { type: string, format: date }
        '400': { $ref: '#/components/responses/LegacyError' }
        '401': { $ref: '#/components/responses/LegacyError' }
        '413':
          description: Fichier de plus de 5 Mo (`Fichier trop volumineux`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyError' }

  /api/manager/expense-notes:
    get:
      tags: [legacy]
      deprecated: true
      summary: (Déprécié) File de validation du manager
      description: Remplacé par `GET /api/expense-notes/pending` (même contenu). Répond 401 si la session n'est pas celle d'un manager.
      responses:
        '200':
          description: Porte `Deprecation` et `Link`.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PendingApproval' } }
        '401': { $ref: '#/components/responses/LegacyError' }
  /api/hr/expense-notes:
    get:
      tags: [legacy]
      deprecated: true
      summary: (Déprécié) File de validation du RH
      description: Remplacé par `GET /api/expense-notes/pending` (même contenu). Répond 403 si la session n'est pas celle d'un RH.
      responses:
        '200':
          description: Porte `Deprecation` et `Link`.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PendingApproval' } }
        '403': { $ref: '#/components/responses/LegacyError' }
  /api/hr/users:
    get:
      tags: [legacy]
      deprecated: true
      summary: (Déprécié) Annuaire de l'entreprise
      description: Remplacé par `GET /api/users`. Répond 403 si la session n'est pas celle d'un RH.
      responses:
        '200':
          description: Porte `Deprecation` et `Link`.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CompanyUser' } }
        '403': { $ref: '#/components/responses/LegacyError' }
  /api/hr/users/{id}/manager:
    put:
      tags: [legacy]
      deprecated: true
      summary: (Déprécié) Rattacher un utilisateur à son manager
      description: |
        Remplacé par `PUT /api/users/{id}/manager`. Codes historiques : 403 hors
        RH, 404 cible introuvable, **409** `{ "error": "Invalid manager" }` là où
        la nouvelle route répond 422.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignManagerRequest' }
      responses:
        '200':
          description: Porte `Deprecation` et `Link`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyUser' }
        '403': { $ref: '#/components/responses/LegacyError' }
        '404': { $ref: '#/components/responses/LegacyError' }
        '409': { $ref: '#/components/responses/LegacyError' }
  /api/manager/expense-notes/{id}/approve:
    post:
      tags: [legacy]
      deprecated: true
      summary: (Déprécié) Approuver la note d'un subordonné
      description: Remplacé par `POST /api/expense-notes/{id}/decision`. Répond 401 si la session n'est pas celle d'un manager.
      parameters: [{ $ref: '#/components/parameters/NoteId' }]
      responses:
        '200': { $ref: '#/components/responses/DeprecatedNote' }
        '401': { $ref: '#/components/responses/LegacyError' }
        '404': { $ref: '#/components/responses/LegacyError' }
        '409': { $ref: '#/components/responses/LegacyError' }
  /api/manager/expense-notes/{id}/reject:
    post:
      tags: [legacy]
      deprecated: true
      summary: (Déprécié) Rejeter la note d'un subordonné
      description: Remplacé par `POST /api/expense-notes/{id}/decision`.
      parameters: [{ $ref: '#/components/parameters/NoteId' }]
      responses:
        '200': { $ref: '#/components/responses/DeprecatedNote' }
        '401': { $ref: '#/components/responses/LegacyError' }
        '404': { $ref: '#/components/responses/LegacyError' }
        '409': { $ref: '#/components/responses/LegacyError' }
  /api/hr/expense-notes/{id}/approve:
    post:
      tags: [legacy]
      deprecated: true
      summary: (Déprécié) Approuver une note qui revient au RH
      description: Remplacé par `POST /api/expense-notes/{id}/decision`. Répond 403 si la session n'est pas celle d'un RH.
      parameters: [{ $ref: '#/components/parameters/NoteId' }]
      responses:
        '200': { $ref: '#/components/responses/DeprecatedNote' }
        '403': { $ref: '#/components/responses/LegacyError' }
        '404': { $ref: '#/components/responses/LegacyError' }
        '409': { $ref: '#/components/responses/LegacyError' }
  /api/hr/expense-notes/{id}/reject:
    post:
      tags: [legacy]
      deprecated: true
      summary: (Déprécié) Rejeter une note qui revient au RH
      description: Remplacé par `POST /api/expense-notes/{id}/decision`.
      parameters: [{ $ref: '#/components/parameters/NoteId' }]
      responses:
        '200': { $ref: '#/components/responses/DeprecatedNote' }
        '403': { $ref: '#/components/responses/LegacyError' }
        '404': { $ref: '#/components/responses/LegacyError' }
        '409': { $ref: '#/components/responses/LegacyError' }
  /api/manager/expense-notes/{id}/receipt-url:
    get:
      tags: [legacy]
      deprecated: true
      summary: (Déprécié) Reçu d'une note, côté manager
      description: Remplacé par `GET /api/expense-notes/{id}/receipt-url`.
      parameters: [{ $ref: '#/components/parameters/NoteId' }]
      responses:
        '200': { description: '`{ url }`' }
        '401': { $ref: '#/components/responses/LegacyError' }
        '404': { $ref: '#/components/responses/LegacyError' }
  /api/hr/expense-notes/{id}/receipt-url:
    get:
      tags: [legacy]
      deprecated: true
      summary: (Déprécié) Reçu d'une note, côté RH
      description: Remplacé par `GET /api/expense-notes/{id}/receipt-url`.
      parameters: [{ $ref: '#/components/parameters/NoteId' }]
      responses:
        '200': { description: '`{ url }`' }
        '403': { $ref: '#/components/responses/LegacyError' }
        '404': { $ref: '#/components/responses/LegacyError' }

components:
  parameters:
    NoteId:
      name: id
      in: path
      required: true
      description: Identifiant de la note de frais.
      schema: { type: string, format: uuid }

  schemas:
    DecisionRequest:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        reason:
          type: string
          maxLength: 1000
          description: Motif facultatif, accepté seulement pour un rejet.

    ExpenseNote:
      type: object
      description: Note de frais. Aucun détail de stockage (le reçu se lit par `GET …/receipt-url`).
      required: [id, userId, amount, expenseDate, description, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        amount: { type: number, example: 42.5 }
        expenseDate: { type: string, format: date }
        description: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        createdAt: { type: string, format: date-time }

    PendingApproval:
      description: Note à trancher, avec le nom de son auteur.
      allOf:
        - $ref: '#/components/schemas/ExpenseNote'
        - type: object
          required: [authorName]
          properties:
            authorName: { type: string }

    CompanyUser:
      type: object
      required: [id, name, email, role, managerId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [employee, manager] }
        managerId: { type: [string, 'null'], format: uuid }

    AssignManagerRequest:
      type: object
      required: [managerId]
      additionalProperties: false
      properties:
        managerId:
          type: [string, 'null']
          format: uuid
          description: Nouveau manager direct, ou `null` pour détacher.

    ReceiptUrl:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }

    Liveness:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }

    HealthChecks:
      type: object
      required: [postgres, storage]
      properties:
        postgres: { type: string, enum: [up, down] }
        storage: { type: string, enum: [up, down] }

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready] }
        checks: { $ref: '#/components/schemas/HealthChecks' }

    Problem:
      description: RFC 9457 — Problem Details for HTTP APIs.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: Identifiant stable du type d'erreur ; c'est sur lui que le client réagit.
          example: https://expense.io/problems/already-decided
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [pointer, detail]
            properties:
              pointer: { type: string, example: '#/decision' }
              detail: { type: string }
        correlationId:
          type: string
          description: Présent sur les 500 ; permet de retrouver l'erreur dans les logs serveur.
        error:
          type: string
          deprecated: true
          description: |
            Message historique, présent seulement sur les routes qui renvoyaient
            `{ error }` avant la 2.0.0 (`/api/expense-notes`, `…/receipt-url`).

    ReceiptSuggestion:
      type: object
      required: [id, status, createdAt, completedAt]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, done, failed]
          description: '`done` et `failed` sont des états finaux : le client arrête le polling.'
        amount:
          type: number
          description: Présent seulement si `done` et reconnu sur le reçu.
        expenseDate:
          type: string
          format: date
          description: Présent seulement si `done` et reconnue sur le reçu.
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }

    Notification:
      type: object
      required: [id, noteId, noteDescription, decision, rejectionReason, createdAt]
      properties:
        id: { type: string, format: uuid }
        noteId: { type: string, format: uuid }
        noteDescription: { type: string }
        decision: { type: string, enum: [approved, rejected] }
        rejectionReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    LegacyError:
      type: object
      required: [error]
      properties:
        error: { type: string }

  responses:
    InvalidRequest:
      description: Corps illisible ou non conforme au schéma.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: Aucune session.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: 'Session valide, mais rôle insuffisant (403, jamais 401 — A7).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Internal:
      description: Erreur interne, sans détail ; `correlationId` pour retrouver l'occurrence dans les logs.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: |
        Note inexistante, ou que l'utilisateur ne peut pas voir : autre entreprise, ou,
        pour un manager, note qui n'est ni la sienne ni celle d'un subordonné direct.
        On ne révèle pas son existence (ADR 0005).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LegacyError:
      description: Erreur au format historique.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LegacyError' }
    DeprecatedNote:
      description: La note tranchée. Porte les en-têtes `Deprecation` et `Link` (successor-version).
      headers:
        Deprecation: { schema: { type: string, example: 'true' } }
        Link: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ExpenseNote' }
